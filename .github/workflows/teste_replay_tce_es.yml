name: Teste de replay direto ao Power BI do TCE-ES (sem navegador)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/teste_replay_tce_es.yml'
      - 'robo_tce_es/testar_replay.py'
      - 'robo_tce_es/consultas/**'
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -q requests

      - name: Testar replay direto da chamada de dados (sem Playwright)
        working-directory: robo_tce_es
        run: python testar_replay.py resultado_replay.json
        continue-on-error: true

      - name: Guardar resultado no repositorio
        run: |
          mkdir -p resultados
          cp robo_tce_es/resultado_replay.json resultados/teste-replay-tce-es.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/teste-replay-tce-es.json
          git commit -m "Resultado do teste de replay direto ao Power BI TCE-ES" || echo "sem mudanca para gravar"
          git push
