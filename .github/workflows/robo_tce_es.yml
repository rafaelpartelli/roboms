name: Robo Painel TCE-ES (Gastos com a funcao saude)

# Extracao validada por HTTP puro, sem navegador e sem bloqueio de IP (ver
# robo_tce_es/LEIA-ME.md). Agendamento: segunda, quarta e sexta, 06:30
# Brasilia (combinado com o Rafael em 15/10/2026).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1,3,5'  # 06:30 Brasilia (UTC-3), seg/qua/sex

concurrency: robo-tce-es

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -q requests

      - name: Extrair dados do Painel TCE-ES
        working-directory: robo_tce_es
        run: python extrair.py bruto.json

      - name: Montar e conferir
        working-directory: robo_tce_es
        run: |
          python montar.py bruto.json dados.json
          curl -fsS "https://partelli.pro/tce/dados.json?x=$(date +%s)" -o publicado.json || echo '{}' > publicado.json
          python - <<'PY'
          import json, sys
          n = json.load(open('dados.json')); a = json.load(open('publicado.json'))
          if a.get('es'):
              for chave, rotulo in [('aplicacao', 'aplicacao total'), ('valorHab', 'valor medio por habitante')]:
                  vn, va = n['es'].get(chave), a['es'].get(chave)
                  print(rotulo + ':', va, '->', vn)
                  if va and not 0.6 < (vn / va) < 1.5:
                      sys.exit(f"variacao suspeita em {rotulo}: {va} -> {vn}; publicacao suspensa")
          PY

      - name: Enviar ao site
        working-directory: robo_tce_es
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
        run: |
          mkdir -p ~/.config/robo_tce_es
          umask 077
          printf 'FTP_HOST=%s\nFTP_USUARIO=%s\nFTP_SENHA=%s\nFTP_PASTA=domains/partelli.pro/public_html/tce\n' "$FTP_HOST" "$FTP_USUARIO" "$FTP_SENHA" > ~/.config/robo_tce_es/.env
          python enviar.py dados.json

      - name: Guardar dados do dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dados-tce-${{ github.run_id }}
          path: robo_tce_es/dados.json
          retention-days: 30
          if-no-files-found: ignore
