name: Teste temporario - gasto proprio do Governo do Estado (Power BI TCE-ES)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -q requests

      - name: Testar filtro de gestao estadual
        working-directory: robo_tce_es
        run: python testar_gestao_estadual.py

      - name: Guardar resultado no repositorio
        run: |
          mkdir -p resultados
          cp robo_tce_es/resultado_gestao_estadual.json resultados/teste-gestao-estadual.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/teste-gestao-estadual.json
          git commit -m "Resultado do teste temporario de gestao estadual" || echo "sem mudanca para gravar"
          git push
