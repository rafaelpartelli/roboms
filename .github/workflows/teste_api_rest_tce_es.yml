name: Teste de acesso a API REST do Painel de Controle TCE-ES

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/teste_api_rest_tce_es.yml', 'robo_tce_es/testar_api_rest.py']

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -q requests

      - name: Testar acesso direto a API REST (paineldecontrole.tcees.tc.br)
        working-directory: robo_tce_es
        run: python testar_api_rest.py teste_api_rest.json
        continue-on-error: true

      - name: Guardar resultado no repositorio
        run: |
          mkdir -p resultados
          cp robo_tce_es/teste_api_rest.json resultados/teste-api-rest-tce-es.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/teste-api-rest-tce-es.json
          git commit -m "Resultado do teste de acesso a API REST do Painel de Controle TCE-ES" || echo "sem mudanca para gravar"
          git push
